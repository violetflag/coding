[package]
name = "nanro"
version = "0.1.2"
description = "난로: 벽난로 서재에서 책을 읽는 윈도우 프로그램"
edition = "2021"
publish = false

[[bin]]
name = "nanro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# compression 을 뺀다: 화면 자료의 대부분이 이미 압축된 사진(약 75MB)이라 다시 압축하면 빌드만 오래 걸린다.
# custom-protocol 을 켠다: tauri CLI 없이 cargo build --release 만으로 ../dist 를 실행 파일에 넣기 위해서다.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "custom-protocol"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
