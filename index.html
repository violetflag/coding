<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>난로</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050302; overflow: hidden; color: #e9dcc6;
      font-family: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", "Malgun Gothic", serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #fire { z-index: 0; right: auto; bottom: auto; }
    #room { z-index: 1; }
    #dot { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%;
      background: rgba(255, 240, 220, .55); z-index: 3; pointer-events: none; opacity: 0; transition: opacity .3s; }
    #prompt { position: fixed; left: 50%; top: calc(50% + 22px); transform: translateX(-50%); z-index: 3; pointer-events: none;
      font-size: 14px; letter-spacing: .02em; text-shadow: 0 1px 6px #000; opacity: 0; transition: opacity .2s; white-space: nowrap; }
    #prompt kbd { font: inherit; border: 1px solid rgba(233, 220, 198, .5); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
    #hint { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 3; pointer-events: none;
      font-size: 13px; opacity: 0; transition: opacity 1s; text-shadow: 0 1px 6px #000; text-align: center; line-height: 1.7; }
    #stats { position: fixed; left: 10px; top: 8px; z-index: 3; font: 12px/1.5 ui-monospace, Consolas, monospace; color: #cdbb9c;
      text-shadow: 0 1px 3px #000; white-space: pre; pointer-events: none; }
    #start { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(5, 3, 2, .72); cursor: pointer; }
    #start div { text-align: center; }
    #start h1 { font-weight: 400; font-size: 44px; letter-spacing: .3em; margin: 0 0 14px .3em; }
    #start p { margin: 4px 0; font-size: 15px; opacity: .8; }
    #start .sub { font-size: 12px; opacity: .55; margin-top: 18px; }
    #openSettings { margin-top: 16px; background: #2a1f15; color: #e9dcc6; border: 1px solid #5c4a33; border-radius: 5px; padding: 7px 16px; font: inherit; font-size: 13px; cursor: pointer; }
    #toast { position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 4; font-size: 14px; opacity: 0;
      transition: opacity .4s; text-shadow: 0 1px 6px #000; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="fire"></canvas>
  <canvas id="room"></canvas>
  <div id="dot"></div>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="hint">W A S D 걷기 · 마우스 둘러보기 · E 상호작용 · Shift 천천히 · Ctrl 쭈그리기<br>앉은 뒤: E 책 펼치기 · Space 일어나기 · O 설정 · F3 성능 표시</div>
  <div id="stats"></div>
  <div id="start"><div><h1>난로</h1><p id="startMsg">불러오는 중…</p><p class="sub">프로토타입 · 회색 상자 방</p><p><button id="openSettings" type="button">설정 (O)</button></p></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
